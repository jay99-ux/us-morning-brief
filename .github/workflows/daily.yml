name: 매일 브리핑 갱신

on:
  schedule:
    # UTC 22:00 = 한국시간 오전 7시 (미국 정규장 마감 후). 월~금 UTC 기준.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # Actions 탭에서 수동 실행
    inputs:
      headline:
        description: "맨 위 핵심 이슈를 직접 쓰기 (비워두면 자동 선정)"
        required: false
        default: ""

permissions:
  contents: write # data/history 기록을 저장소에 커밋하기 위해 필요
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 수집과 페이지 생성
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # 없으면 경제지표 일정만 빠집니다
          HEADLINE: ${{ inputs.headline }}
        run: python scripts/build.py
      - name: 오늘 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "새 기록 없음"
          else
            git commit -m "브리핑 기록 $(ls data/history | sort | tail -1 | cut -d. -f1)"
            git pull --rebase --quiet
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
